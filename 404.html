<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found | Bartosz Chrominski</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
:root { --bg: #13110e; --ink: #ece4d4; --ink-2: #b3a993; --ink-3: #9a907b; --amber: #ffb224; --line: rgba(236,228,212,.12); --line-strong: rgba(236,228,212,.24); --glow: rgba(255,178,36,.16); }
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --bg: #f2ecdf; --ink: #1c1812; --ink-2: #4f4636; --ink-3: #6e634e; --amber: #9a4f05; --line: rgba(32,26,18,.13); --line-strong: rgba(32,26,18,.28); --glow: rgba(214,120,10,.14); }
}
:root[data-theme="light"] { --bg: #f2ecdf; --ink: #1c1812; --ink-2: #4f4636; --ink-3: #6e634e; --amber: #9a4f05; --line: rgba(32,26,18,.13); --line-strong: rgba(32,26,18,.28); --glow: rgba(214,120,10,.14); }
:root[data-theme="dark"] { --bg: #13110e; --ink: #ece4d4; --ink-2: #b3a993; --ink-3: #9a907b; --amber: #ffb224; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background-color: var(--bg); background-image: radial-gradient(900px 520px at 80% -10%, var(--glow), transparent 62%), radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 1.4px); background-size: auto, 28px 28px; color: var(--ink); font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 15px; line-height: 1.6; }
main { width: 100%; max-width: 720px; }
.k { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 20px; }
h1 { font-family: "Fraunces", Georgia, serif; font-variation-settings: "opsz" 144, "SOFT" 30; font-weight: 900; font-size: clamp(88px, 22vw, 200px); line-height: .85; letter-spacing: -.05em; margin: 0 0 24px; }
h1 span { color: var(--amber); }
p { color: var(--ink-2); margin: 0 0 32px; max-width: 34em; }
pre { font-family: inherit; font-size: 13px; color: var(--ink-3); border-left: 2px solid var(--amber); padding: 4px 0 4px 14px; margin: 0 0 32px; white-space: pre-wrap; }
nav { display: flex; flex-wrap: wrap; gap: 12px; }
a { display: inline-flex; align-items: center; padding: 12px 18px; border-radius: 999px; text-decoration: none; font-size: 13px; font-weight: 600; color: var(--ink); border: 1px solid var(--line-strong); }
a:first-child { background: var(--amber); color: var(--bg); border-color: var(--amber); }
a:hover { border-color: var(--amber); }
</style>
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
<main>
  <p class="k">Error 404 · Nie znaleziono</p>
  <h1>404<span>.</span></h1>
  <pre>✗ stage: resolve-path
  this page is not part of the run</pre>
  <p>The page you were looking for doesn't exist or has moved. Strona, której szukasz, nie istnieje albo została przeniesiona.</p>
  <nav>
    <a href="/">Home</a>
    <a href="/pl/" lang="pl">Strona główna</a>
    <a href="/#contact">Contact</a>
  </nav>
</main>
</body>
</html>
